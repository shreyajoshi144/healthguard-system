# Both services build from ./Dockerfile (runtime: docker) because document OCR needs the Tesseract binary, which Render's native
# Python runtime cannot install. The image's WORKDIR is /app, so the relative script paths below resolve there.
services:
  - type: web
    name: healthguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    preDeployCommand: "./scripts/migrate.sh"
    dockerCommand: "./scripts/production-start.sh"
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: us-east-1
      - key: STORAGE_SSE
        value: AES256
      - key: HEALTHGUARD_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: HEALTHGUARD_PUBLIC_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: HEALTHGUARD_LLM_PROVIDER
        value: openai_compatible
      - key: HEALTHGUARD_LLM_BASE_URL
        sync: false
      - key: HEALTHGUARD_LLM_MODEL
        sync: false
      - key: HEALTHGUARD_LLM_API_KEY
        sync: false
      - key: HEALTHGUARD_EMBEDDING_PROVIDER
        value: openai_compatible
      - key: HEALTHGUARD_EMBEDDING_BASE_URL
        sync: false
      - key: HEALTHGUARD_EMBEDDING_MODEL
        sync: false
      - key: HEALTHGUARD_EMBEDDING_API_KEY
        sync: false
      - key: HEALTHGUARD_AI_TIMEOUT_SECONDS
        value: "45"
      - key: HEALTHGUARD_AI_MAX_RETRIES
        value: "1"
      - key: HEALTHGUARD_METRICS_TOKEN
        sync: false

  - type: web
    name: healthguard-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: "./scripts/production-worker.sh"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: us-east-1
      - key: STORAGE_SSE
        value: AES256
      - key: HEALTHGUARD_JWT_SECRET
        sync: false
      # The worker sends follow-up reminders and alert email: same SMTP_* and public URL as the API (set both services identically).
      - key: HEALTHGUARD_PUBLIC_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: HEALTHGUARD_LLM_PROVIDER
        value: openai_compatible
      - key: HEALTHGUARD_LLM_BASE_URL
        sync: false
      - key: HEALTHGUARD_LLM_MODEL
        sync: false
      - key: HEALTHGUARD_LLM_API_KEY
        sync: false
      - key: HEALTHGUARD_EMBEDDING_PROVIDER
        value: openai_compatible
      - key: HEALTHGUARD_EMBEDDING_BASE_URL
        sync: false
      - key: HEALTHGUARD_EMBEDDING_MODEL
        sync: false
      - key: HEALTHGUARD_EMBEDDING_API_KEY
        sync: false
      - key: HEALTHGUARD_AI_TIMEOUT_SECONDS
        value: "45"
      - key: HEALTHGUARD_AI_MAX_RETRIES
        value: "1"
      - key: HEALTHGUARD_METRICS_TOKEN
        sync: false
      - key: HEALTHGUARD_WORKER_ID
        value: render-worker-1
