services:
  migrate:
    build: .
    command: /app/scripts/migrate.sh
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  metrics-init:
    build: .
    command: sh -c "mkdir -p /var/run/healthguard/metrics && find /var/run/healthguard/metrics -type f -delete"
    volumes:
      - metrics:/var/run/healthguard/metrics
    restart: "no"

  api:
    build: .
    command: /app/scripts/production-start.sh
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /var/run/healthguard/metrics
    depends_on:
      migrate:
        condition: service_completed_successfully
      metrics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    volumes:
      - metrics:/var/run/healthguard/metrics
      - private_storage:/app/private_storage

  worker:
    build: .
    command: /app/scripts/production-worker.sh
    env_file: .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /var/run/healthguard/metrics
      HEALTHGUARD_WORKER_ID: worker-compose-1
    depends_on:
      migrate:
        condition: service_completed_successfully
      metrics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    volumes:
      - metrics:/var/run/healthguard/metrics
      - private_storage:/app/private_storage
    healthcheck:
      test: ["CMD", "python", "/app/scripts/worker-healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Free development mailbox: catches every email (verification, reminders, alerts); nothing is delivered externally.
  # SMTP on mailpit:1025 (no TLS, no auth), web UI at http://127.0.0.1:8025. Development only — never used in production.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
    entrypoint: /bin/sh
    command: -c 'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$STORAGE_BUCKET"'
    restart: "no"

volumes:
  pgdata:
  miniodata:
  metrics:
  private_storage:
