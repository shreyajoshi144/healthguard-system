<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family & Care Access — HealthGuard</title><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/workspace.css"></head><body class="workspace-body"><div class="workspace-main" style="margin-left:0"><header class="topbar"><div><span class="eyebrow">Care continuity</span><h1>Family & controlled sharing</h1><p>Owner-controlled scopes, temporary clinical shares, expiration and revocation.</p></div><div class="topbar-actions"><a class="btn btn-ghost btn-sm" href="/health">Back</a></div></header><main class="workspace-content"><section class="card panel" style="padding:20px"><label>Patient ID<input id="patient" style="width:100%;margin:8px 0;padding:10px"></label><button id="load" class="btn btn-primary btn-sm">Load access</button><div id="out" style="margin-top:16px"></div></section></main></div><script src="/js/api.js"></script><script>
const out=document.getElementById('out'); document.getElementById('load').onclick=async()=>{const id=document.getElementById('patient').value.trim();if(!id)return;try{const [g,s]=await Promise.all([HealthGuardAPI.request(`/api/patients/${id}/access`),HealthGuardAPI.request(`/api/patients/${id}/shares`)]);out.innerHTML=`<h3>Relationships</h3>${g.map(x=>`<div class="card panel" style="padding:12px;margin:8px 0"><strong>${x.email}</strong> · ${x.role}<div>${x.scopes.join(', ')}</div><small>${x.status}${x.expires_at?' · expires '+x.expires_at:''}</small></div>`).join('')||'<p>No relationships.</p>'}<h3>Temporary shares</h3>${s.map(x=>`<div class="card panel" style="padding:12px;margin:8px 0"><strong>${x.status}</strong> · ${x.scopes.join(', ')}<div>Expires ${x.expires_at}</div></div>`).join('')||'<p>No shares.</p>'}`;}catch(e){out.textContent=e.message;}};
</script></body></html>
